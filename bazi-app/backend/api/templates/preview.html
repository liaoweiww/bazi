<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>易经八字</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0604;
  color:#e8dcc8;
  font-family:'Noto Serif SC','STKaiti','KaiTi','楷体',serif;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(180,140,80,.04) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(180,100,40,.03) 0%, transparent 50%);
}
.wrap{max-width:440px;margin:0 auto;padding:0 14px 40px}

/* ===== 首页 ===== */
.hero{text-align:center;padding:36px 0 4px;position:relative}
.hero-rings{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:180px;pointer-events:none}
.hero-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid}
.hero-ring.r1{width:180px;height:180px;border-color:rgba(201,169,110,.06)}
.hero-ring.r2{width:140px;height:140px;border-color:rgba(201,169,110,.1)}
.hero-ring.r3{width:100px;height:100px;border-color:rgba(201,169,110,.14)}
.hero h1{font-size:44px;color:#d4af37;letter-spacing:14px;position:relative;text-shadow:0 2px 16px rgba(212,175,55,.15);font-weight:700}
.hero .sub{font-size:14px;color:#8b7355;letter-spacing:5px;position:relative;margin-top:10px;font-weight:300}

.logo-divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 20px}
.logo-divider .line{width:36px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,110,.25),transparent)}
.logo-divider .diamond{width:10px;height:10px;background:rgba(201,169,110,.3);transform:rotate(45deg);border-radius:1px}

/* 卡片 */
.card{background:linear-gradient(180deg, rgba(22,14,8,.85) 0%, rgba(18,10,6,.9) 100%);border:1px solid #2a1c10;border-top:1px solid rgba(201,169,110,.12);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.card-section{margin-bottom:12px}
.ct{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;color:#d4af37;margin-bottom:12px;letter-spacing:4px;cursor:pointer;user-select:none;font-weight:700}
.ct-arrow{font-size:10px;color:#6b5e4e;margin-left:2px;transition:transform .2s}
.ct .icon{font-size:20px}
.card-body{overflow:hidden;transition:all .3s}
.card-body.hide{display:none}

.gold{color:#d4af37}.dim{color:#9a8e7e}.muted{color:#6b5e4e}.red{color:#d44444}.tc{text-align:center}.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}

/* 表单 */
.fg{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(51,36,24,.25)}
.fg:last-child{border-bottom:none;margin-bottom:0}
.fl{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:15px;color:#c9a96e;letter-spacing:2px}
.fl .fi{font-size:18px}
.fi{width:100%;height:44px;background:rgba(10,6,2,.4);border:1px solid rgba(61,43,26,.5);border-radius:10px;padding:0 12px;font-size:15px;color:#f5f0e8;outline:none;font-family:inherit;transition:border-color .2s}
.fi:focus{border-color:rgba(201,169,110,.4);box-shadow:0 0 0 2px rgba(201,169,110,.06)}
.dr{display:flex;gap:8px}
.dr .fi{flex:1;text-align:center}
.tog{display:flex;border-radius:10px;overflow:hidden;border:1px solid rgba(61,43,26,.5)}
.tog-btn{flex:1;text-align:center;padding:12px 8px;font-size:14px;color:#9a8e7e;background:rgba(10,6,2,.3);border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.tog-btn.on{background:rgba(201,169,110,.1);color:#d4af37;font-weight:700}

.btn-go{width:100%;background:linear-gradient(135deg,#b22222,#8b0000);border:none;border-radius:14px;padding:18px;color:#e0c68c;font-size:22px;letter-spacing:10px;font-family:inherit;font-weight:700;cursor:pointer;margin-top:16px;box-shadow:0 4px 20px rgba(139,0,0,.35);transition:all .15s}
.btn-go:active{transform:scale(.98);opacity:.9}
.btn-go-sub{display:block;font-size:11px;letter-spacing:4px;opacity:.5;margin-top:2px;font-weight:400}

/* 底部 */
.footer{text-align:center;font-size:11px;color:#4a3a2a;padding:16px 0 8px;letter-spacing:2px}

/* ===== 结果页 ===== */
.result-header{text-align:center;padding:20px 0 10px;border-bottom:1px solid rgba(51,36,24,.3);margin-bottom:14px}
.result-header h2{font-size:20px;color:#d4af37;letter-spacing:6px}
.result-header .name{font-size:14px;color:#8b7355;margin-top:4px}

/* 四柱 */
.pgrid{display:flex;gap:5px}
.pc{flex:1;text-align:center;padding:12px 3px;border-radius:10px;background:rgba(10,6,2,.3);border:1px solid #332418;position:relative}
.pc.dm{border-color:#b22222;box-shadow:0 0 16px rgba(178,34,34,.1);background:rgba(178,34,34,.04)}
.pc .gz{font-size:26px;color:#e0c68c;font-weight:700;line-height:1.3}
.pc .ss{font-size:10px;color:#d44444;margin:3px 0}
.pc .ny{font-size:9px;color:#6b5e4e}
.pc .cg{font-size:9px;color:#9a8e7e}
.dm-badge{display:inline-block;padding:2px 8px;background:#b22222;color:#fff;border-radius:10px;font-size:8px;margin-top:2px}
.dm-info{text-align:center;margin-top:10px;font-size:14px;color:#9a8e7e}

/* 标签 */
.tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tag{display:inline-flex;align-items:center;gap:3px;padding:4px 12px;border-radius:14px;font-size:11px}
.tag-y{background:rgba(196,69,54,.1);color:#d44444;border:1px solid rgba(196,69,54,.2)}
.tag-j{background:rgba(74,112,152,.1);color:#7aa8d0;border:1px solid rgba(74,112,152,.2)}
.dot{width:4px;height:4px;border-radius:50%;background:#d44444}
.tag-j .dot{background:#7aa8d0}
.st-badge{display:inline-block;padding:6px 20px;border-radius:20px;font-size:16px;font-weight:700;letter-spacing:2px}
.st-s{background:rgba(178,34,34,.15);color:#d44444;border:1px solid rgba(178,34,34,.3)}
.st-w{background:rgba(74,112,152,.15);color:#7aa8d0;border:1px solid rgba(74,112,152,.3)}
.st-n{background:rgba(201,169,110,.1);color:#e0c68c;border:1px solid rgba(201,169,110,.3)}

/* 大运 */
.dy-scroll{display:flex;gap:5px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.dy-node{min-width:64px;text-align:center;padding:10px 5px;border-radius:10px;background:rgba(10,6,2,.3);border:1px solid #332418;flex-shrink:0}
.dy-node.cur{border-color:#c9a96e;background:rgba(201,169,110,.06);box-shadow:0 0 10px rgba(201,169,110,.08)}
.dy-ages{font-size:9px;color:#6b5e4e}.dy-gz{font-size:17px;color:#e0c68c;font-weight:700}.dy-ny{font-size:8px;color:#6b5e4e}
.ln-box{text-align:center;padding:16px;background:rgba(10,6,2,.25);border-radius:10px;border:1px dashed rgba(201,169,110,.12);margin-top:10px}
.ln-gz{font-size:30px;color:#e0c68c;font-weight:700}

/* 年运 */
.year-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px}
.year-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(201,169,110,.15);background:rgba(201,169,110,.05);color:#c9a96e;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .15s}
.year-btn:hover{background:rgba(201,169,110,.15)}
.year-num{font-size:26px;color:#e0c68c;font-weight:700}
.fn-label{text-align:center;font-size:16px;color:#d4af37;margin-bottom:4px}
.fn-rating{display:inline-block;padding:4px 18px;border-radius:14px;font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:1px}
.rt-great{background:rgba(212,175,55,.15);color:#d4af37;border:1px solid rgba(212,175,55,.3)}
.rt-good{background:rgba(90,154,106,.1);color:#5a9a6a;border:1px solid rgba(90,154,106,.2)}
.rt-warn{background:rgba(196,30,58,.1);color:#e06070;border:1px solid rgba(196,30,58,.2)}
.rt-mid{background:rgba(139,115,85,.1);color:#8b7355;border:1px solid rgba(139,115,85,.2)}
.fn-text{font-size:13px;color:#c0b090;line-height:1.8}
.fn-dy{font-size:12px;color:#9a8e7e;margin-top:8px;padding:10px;background:rgba(10,6,2,.2);border-radius:8px;line-height:1.7}
.fn-rel{font-size:12px;color:#c9a96e;padding:4px 0 4px 10px;border-left:2px solid rgba(201,169,110,.2);margin-bottom:4px}
.fn-advice{font-size:13px;color:#f5f0e8;line-height:1.8;padding:12px;background:rgba(212,175,55,.04);border-radius:10px;border:1px solid rgba(212,175,55,.08);margin-top:8px}

/* 出生信息行 */
.ir{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(51,36,24,.25);font-size:13px}
.ir:last-child{border-bottom:none}

/* 五行条 */
.wx-bar-wrap{margin-bottom:7px;display:flex;align-items:center;gap:10px}
.wx-bar-name{width:18px;font-size:14px;font-weight:700;text-align:center}
.wx-bar-bg{flex:1;height:8px;background:rgba(10,6,2,.35);border-radius:5px;overflow:hidden}
.wx-bar-fill{height:100%;border-radius:5px;transition:width .5s}
.wx-bar-score{font-size:11px;color:#9a8e7e;width:32px;text-align:right}

/* 破解法 */
.rem-block{margin-bottom:12px;padding:12px;background:rgba(10,6,2,.2);border-radius:10px;border-left:3px solid rgba(201,169,110,.2)}
.rem-title{font-size:14px;color:#d4af37;margin-bottom:4px;font-weight:700}
.rem-method{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12px;color:#c0b090;line-height:1.6}
.rem-badge{font-size:9px;padding:2px 8px;border-radius:8px;background:rgba(201,169,110,.1);color:#c9a96e;border:1px solid rgba(201,169,110,.15);white-space:nowrap;flex-shrink:0}
.rem-badge-gen{background:rgba(90,154,106,.08);color:#5a9a6a;border-color:rgba(90,154,106,.15)}
.rem-mname{color:#e0c68c;font-weight:700;white-space:nowrap}

/* 把控 */
.ctrl-block{margin-bottom:14px;padding:12px;background:rgba(10,6,2,.2);border-radius:10px;border-left:3px solid rgba(74,112,152,.2)}
.ctrl-title{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ctrl-icon-wrap{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(74,112,152,.08);border:1px solid rgba(74,112,152,.15);border-radius:8px;font-size:16px;color:#7aa8d0;flex-shrink:0}
.ctrl-tips{margin-top:8px}
.ctrl-tip{font-size:12px;color:#9a8e7e;padding:3px 0;line-height:1.7;padding-left:16px;position:relative}
.ctrl-tip::before{content:'✦';position:absolute;left:2px;color:rgba(201,169,110,.4);font-size:8px;top:5px}

/* 书籍 */
.book-section{margin-top:12px}
.book-card{display:flex;gap:12px;margin-bottom:14px;padding:10px;background:rgba(10,6,2,.15);border-radius:10px;border:1px solid rgba(51,36,24,.2)}
.book-cover{width:48px;height:62px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(201,169,110,.08),rgba(201,169,110,.02));border:1px solid rgba(201,169,110,.12);border-radius:8px;font-size:24px;color:#d4af37;flex-shrink:0;font-weight:700}
.book-info{flex:1;min-width:0}
.book-title{font-size:17px;color:#d4af37;font-weight:700}
.book-meta{font-size:10px;color:#8b7355;margin:3px 0}
.book-cat{display:inline-block;font-size:9px;padding:2px 8px;background:rgba(201,169,110,.06);border:1px solid rgba(201,169,110,.12);border-radius:6px;color:#c9a96e;margin-top:3px}
.book-intro{font-size:13px;color:#c0b090;line-height:1.7;margin-top:6px}
.book-relevance{font-size:12px;color:#9a8e7e;margin-top:8px;padding:10px;background:rgba(10,6,2,.2);border-radius:8px;line-height:1.7;border-left:2px solid rgba(201,169,110,.15)}
.book-chapter{font-size:11px;color:#9a8e7e;padding:2px 0 2px 8px;line-height:1.6}
.book-quote{font-size:12px;color:#c9a96e;padding:3px 0 3px 12px;border-left:2px solid rgba(201,169,110,.15);margin-bottom:3px;font-style:italic}
.book-divider{margin:10px 0;border-bottom:1px dashed rgba(51,36,24,.3)}

.btn-back{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;background:rgba(201,169,110,.05);border:1px solid rgba(201,169,110,.12);border-radius:12px;color:#c9a96e;font-size:16px;cursor:pointer;font-family:inherit;margin-top:14px;letter-spacing:4px;transition:all .15s}
.btn-back:hover{background:rgba(201,169,110,.1)}

.vd{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(51,36,24,.2);font-size:13px;line-height:1.9;color:#c0b090}
.vd:last-child{border-bottom:none}

.loading{text-align:center;padding:24px;color:#8b7355;font-size:14px}

.section-header{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.section-header .icon{font-size:22px}
.section-header .title{font-size:18px;color:#d4af37;letter-spacing:3px;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app">
  <!-- 首页 -->
  <div id="pageIndex">
    <div class="hero">
      <div class="hero-rings">
        <div class="hero-ring r1"></div>
        <div class="hero-ring r2"></div>
        <div class="hero-ring r3"></div>
      </div>
      <h1>易 经 八 字</h1>
      <div class="sub">探寻命理玄机 · 洞悉人生轨迹</div>
    </div>
    <div class="logo-divider">
      <div class="line"></div>
      <div class="diamond"></div>
      <div class="line"></div>
    </div>

    <div class="card" id="formCard">
      <div class="fg">
        <div class="fl"><span class="fi-icon">👤</span> 姓 名</div>
        <input class="fi" id="name" placeholder="请输入姓名" maxlength="20">
      </div>
      <div class="fg">
        <div class="fl"><span class="fi-icon">⚧</span> 性 别</div>
        <div class="tog" id="genderTog">
          <button class="tog-btn on" data-v="男">☰ 乾 造（男）</button>
          <button class="tog-btn" data-v="女">☷ 坤 造（女）</button>
        </div>
      </div>
      <div class="fg">
        <div class="fl"><span class="fi-icon">📅</span> 历 法</div>
        <div class="tog" id="calTog">
          <button class="tog-btn on" data-v="solar">☀ 公 历</button>
          <button class="tog-btn" data-v="lunar">🌙 农 历</button>
        </div>
      </div>
      <div class="fg" id="solarDate">
        <div class="fl"><span class="fi-icon">🎂</span> 出生日期（公历）</div>
        <div class="dr">
          <input class="fi" type="number" id="sy" placeholder="年" value="1990">
          <input class="fi" type="number" id="sm" placeholder="月" value="6">
          <input class="fi" type="number" id="sd" placeholder="日" value="15">
        </div>
      </div>
      <div class="fg" id="lunarDate" style="display:none">
        <div class="fl"><span class="fi-icon">🎂</span> 出生日期（农历）</div>
        <div class="dr">
          <input class="fi" type="number" id="ly" placeholder="年" value="1990">
          <input class="fi" type="number" id="lm" placeholder="月" value="5">
          <input class="fi" type="number" id="ld" placeholder="日" value="21">
        </div>
        <div class="tog" style="margin-top:8px" id="leapTog">
          <button class="tog-btn on" data-v="0">正常月</button>
          <button class="tog-btn" data-v="1">闰 月</button>
        </div>
      </div>
      <div class="fg">
        <div class="fl"><span class="fi-icon">🕐</span> 出生时间</div>
        <div class="dr">
          <input class="fi" type="number" id="fh" placeholder="时" value="8" min="0" max="23">
          <input class="fi" type="number" id="fm" placeholder="分" value="0" min="0" max="59">
        </div>
      </div>
      <button class="btn-go" onclick="doPaipan()">
        开 始 排 盘
        <span class="btn-go-sub">一窥命理玄机</span>
      </button>
    </div>
    <div class="footer">— 古籍级 · 纯正子平术 · 本地离线 —</div>
  </div>

  <!-- 结果页 -->
  <div id="pageResult" style="display:none" class="result"></div>
</div>

<script>
const API = '/api';
let paipanData = null;
let currentFortuneYear = new Date().getFullYear();

// 切换控件
document.querySelectorAll('.tog').forEach(tog => {
  tog.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', function(){
      this.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on'));
      this.classList.add('on');
      if(this.parentElement.id === 'calTog'){
        document.getElementById('solarDate').style.display = this.dataset.v === 'solar' ? '' : 'none';
        document.getElementById('lunarDate').style.display = this.dataset.v === 'lunar' ? '' : 'none';
      }
    });
  });
});

function getFormData(){
  const gender = document.querySelector('#genderTog .on').dataset.v;
  const calType = document.querySelector('#calTog .on').dataset.v;
  const hour = parseInt(document.getElementById('fh').value) || 0;
  const minute = parseInt(document.getElementById('fm').value) || 0;
  const name = document.getElementById('name').value || '未命名';

  let body = {name, gender, hour, minute, longitude:120, latitude:30, calendar_type: calType};

  if(calType === 'lunar'){
    body.lunar_year = parseInt(document.getElementById('ly').value);
    body.lunar_month = parseInt(document.getElementById('lm').value);
    body.lunar_day = parseInt(document.getElementById('ld').value);
    body.leap_month = document.querySelector('#leapTog .on').dataset.v === '1';
  } else {
    body.solar_year = parseInt(document.getElementById('sy').value);
    body.solar_month = parseInt(document.getElementById('sm').value);
    body.solar_day = parseInt(document.getElementById('sd').value);
  }
  return body;
}

async function doPaipan(){
  const form = document.getElementById('formCard');
  form.style.opacity = '0.5';
  form.style.pointerEvents = 'none';

  try {
    const res = await fetch(API + '/paipan', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(getFormData())
    });
    const json = await res.json();
    if(!json.success){ alert(json.error); return; }
    paipanData = json.data;
    document.getElementById('pageIndex').style.display = 'none';
    document.getElementById('pageResult').style.display = '';
    showResult();
    loadModules();
  } catch(e) {
    alert('请求失败：' + e.message);
  } finally {
    form.style.opacity = '';
    form.style.pointerEvents = '';
  }
}

function showResult(){
  const d = paipanData;
  let html = '';

  // 姓名标题
  html += `<div class="result-header"><h2>${d.name||'命盘'} · 八字解读</h2><div class="name">${d.birth_info.solar_date} · ${d.birth_info.gender==='男'?'☰ 乾造':'☷ 坤造'}</div></div>`;

  // 八字命盘
  html += '<div class="card"><div class="ct"><span class="icon">☯</span>八 字 命 盘</div>';
  html += '<div class="pgrid">';
  ['year','month','day','hour'].forEach((pk) => {
    const p = d.four_pillars[pk];
    const dm = pk === 'day';
    html += `<div class="pc${dm?' dm':''}">
      <div class="gz">${p.ganzhi}</div>
      ${dm?'<div class="dm-badge">日主</div>':`<div class="ss">${p.shishen||''}</div>`}
      <div class="ny">${p.nayin||''}</div>
      <div class="cg">藏: ${(p.canggan||[]).join('')}</div>
    </div>`;
  });
  html += '</div>';
  html += `<div class="dm-info">日 主：<span class="gold" style="font-size:18px;font-weight:700">${d.day_master}</span>（${d.day_master_wuxing}）</div></div>`;

  // 出生信息（折叠）
  const b = d.birth_info;
  html += '<div class="card"><div class="ct" onclick="toggleCard(this)"><span class="icon">📋</span>出 生 信 息 <span class="ct-arrow">▼</span></div>';
  html += '<div class="card-body hide">';
  html += `<div class="ir"><span class="dim">公历</span><span>${b.solar_date} ${b.solar_time}</span></div>`;
  html += `<div class="ir"><span class="dim">农历</span><span>${b.lunar_date||'-'}</span></div>`;
  html += `<div class="ir"><span class="dim">真太阳时</span><span>${b.true_solar_time}</span></div>`;

      <span class="wx-bar-score">${info.score||0}分</span>

  html += `<div class="tc mt12"><span class="st-badge ${hasQ?'st-s':hasW?'st-w':'st-n'}">${sl.level||'?'}</span></div>`;
  html += `<div class="dim tc mt8" style="font-size:12px">${sl.details||''}</div></div>`;

  // 年运分析
  html += '<div class="card"><div class="ct" onclick="toggleCard(this)"><span class="icon">🔮</span>年 运 分 析 <span class="ct-arrow">▼</span></div>';
  html += '<div class="card-body hide" id="yearFortuneBox"><div class="loading">加载中...</div></div></div>';

  // 时运分析
  html += '<div class="card"><div class="ct" onclick="toggleCard(this)"><span class="icon">⏳</span>时 运 分 析 <span class="ct-arrow">▼</span></div>';
  html += '<div class="card-body hide" id="currentFortuneBox"><div class="loading">加载中...</div></div></div>';

  // 大运
  const dy = d.dayun||{};
  html += '<div class="card"><div class="ct" onclick="toggleCard(this)"><span class="icon">📈</span>大 运 流 程 <span class="ct-arrow">▼</span></div>';
  html += '<div class="card-body hide">';
  html += `<div class="dim tc" style="font-size:12px;margin-bottom:8px">起运 <span class="gold" style="font-size:18px;font-weight:700">${dy.start_age||0}</span> 岁 · ${dy.direction||''}</div>`;
  html += '<div class="dy-scroll">';
  const now = new Date();
  const curAge = now.getFullYear() - parseInt(b.solar_date.split('-')[0]);
  (dy.dayun_list||[]).forEach(dn => {
    const isCur = dn.start_age <= curAge && curAge < dn.start_age + 10;
    html += `<div class="dy-node${isCur?' cur':''}">
      <div class="dy-ages">${dn.age_range||''}</div>
      <div class="dy-gz">${dn.ganzhi||''}</div>
      <div class="dy-ny">${dn.nayin||''}</div>
    </div>`;
  });
  html += '</div>';
  if(dy.liunian_current && dy.liunian_current.ganzhi){
    const lc = dy.liunian_current;
    html += `<div class="ln-box"><div class="ln-gz">${lc.ganzhi}</div>`;
    html += `<div class="dim" style="font-size:10px;margin:4px 0">${lc.wuxing||''} · ${lc.shishen||''} · ${lc.nayin||''}</div>`;
    html += `<div class="muted" style="font-size:12px">${lc.analysis||''}</div></div>`;
  }
  html += '</div></div>';

  // 破解法
  html += '<div class="card"><div class="ct" onclick="toggleCard(this)"><span class="icon">💡</span>破 解 与 补 益 <span class="ct-arrow">▼</span></div>';
  html += '<div class="card-body hide" id="remedyBox"><div class="loading">加载中...</div></div></div>';

  // 胎元命宫身宫
  html += '<div class="card"><div class="ct"><span class="icon">🏠</span>胎 元 · 命 宫 · 身 宫</div>';
  html += '<div style="display:flex;gap:20px;justify-content:center;text-align:center">';
  html += `<div><div class="dim" style="font-size:10px">胎元</div><div class="gold" style="font-size:20px;font-weight:700">${d.taiyuan||'-'}</div></div>`;
  html += `<div><div class="dim" style="font-size:10px">命宫</div><div class="gold" style="font-size:20px;font-weight:700">${d.minggong||'-'}</div></div>`;
  html += `<div><div class="dim" style="font-size:10px">身宫</div><div class="gold" style="font-size:20px;font-weight:700">${d.shengong||'-'}</div></div>`;
  html += '</div>';
  if(d.kongwang && d.kongwang.length) html += `<div class="tc mt8" style="font-size:12px"><span class="dim">空亡：</span><span class="red">${d.kongwang.join('、')}</span></div>`;
  html += '</div>';

  // 神煞
  if(d.shensha && Object.keys(d.shensha).length){
    html += '<div class="card"><div class="ct" onclick="toggleCard(this)"><span class="icon">🔱</span>神 煞 <span class="ct-arrow">▼</span></div>';
    html += '<div class="card-body hide"><div class="tags">';
    for(const [name, items] of Object.entries(d.shensha)){
      items.forEach(it => {
        const pn = it.pillar==='year'?'年':it.pillar==='month'?'月':it.pillar==='day'?'日':'时';
        html += `<span class="tag tag-y">${name}(${pn})</span>`;
      });
    }
    html += '</div></div></div>';
  }

  // 十二长生
  if(d.changsheng){
    html += '<div class="card"><div class="ct"><span class="icon">🌱</span>十 二 长 生</div>';
    html += '<div style="display:flex;gap:6px;text-align:center;font-size:11px">';
    ['year','month','day','hour'].forEach(pk => {
      const cs = d.changsheng[pk];
      if(cs){
        const pn = pk==='year'?'年':pk==='month'?'月':pk==='day'?'日':'时';
        html += `<div style="flex:1"><div class="dim">${pn}</div><div class="gold" style="font-size:15px;font-weight:700">${cs.zhi}</div><div class="dim" style="font-size:10px">${cs.state}</div></div>`;
      }
    });
    html += '</div></div>';
  }

  // 白话解读
  html += '<div class="card"><div class="ct" onclick="toggleCard(this)"><span class="icon">📜</span>白 话 解 读 <span class="ct-arrow">▼</span></div>';
  html += '<div class="card-body hide" id="vernacularBox"><div class="loading">加载中...</div></div></div>';

  // 如何把控
  html += '<div class="card"><div class="ct" onclick="toggleCard(this)"><span class="icon">🎯</span>如 何 把 控 人 生 <span class="ct-arrow">▼</span></div>';
  html += '<div class="card-body hide" id="controlBox"><div class="loading">加载中...</div></div></div>';

  // 参考书籍（根据八字个性化）
  html += '<div class="card"><div class="ct" onclick="toggleCard(this)"><span class="icon">📚</span>参 考 书 籍 <span class="ct-arrow">▼</span></div>';
  html += '<div class="card-body hide" id="booksBox"><div class="loading">加载中...</div></div></div>';

  html += '<button class="btn-back" onclick="goBack()">🔄 重 新 排 盘</button>';
  html += '<div style="height:30px"></div>';

  document.getElementById('pageResult').innerHTML = html;
}

function loadModules(){
  if(!paipanData) return;
  const postData = {paipan_result: paipanData};
  const d = paipanData;

  // 白话解读
  fetch(API+'/vernacular',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(postData)})
    .then(r=>r.json()).then(j=>{
      if(!j.success) return;
      let h='';
      if(j.data.日主概述) h+=`<div class="vd">${j.data.日主概述}</div>`;
      if(j.data.格局解读) h+=`<div class="vd">${j.data.格局解读}</div>`;
      if(j.data.喜用神建议) h+=`<div class="vd">${j.data.喜用神建议}</div>`;
      if(j.data.综合建议) h+=`<div class="vd">${j.data.综合建议}</div>`;
      if(j.data.四柱解读){
        h+='<div class="vd">';
        ['年柱','月柱','日柱','时柱'].forEach(l => {
          if(j.data.四柱解读[l]) h+=`<div style="margin-bottom:6px"><span class="gold" style="font-weight:700">${l}</span>：${j.data.四柱解读[l]}</div>`;
        });
        h+='</div>';
      }
      const el = document.getElementById('vernacularBox');
      if(el) el.innerHTML = h || '<div class="dim tc">暂无解读数据</div>';
    });

  // 年运
  fetch(API+'/year-fortune',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...postData,year:currentFortuneYear})})
    .then(r=>r.json()).then(j=>renderYearFortune(j.data));

  // 时运
  fetch(API+'/current-fortune',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(postData)})
    .then(r=>r.json()).then(j=>{
      if(!j.success) return;
      const cf = j.data;
      let h='';
      h+=`<div class="fn-label">当前 ${cf.current_age} 岁 · ${cf.dayun.ganzhi} 大运</div>`;
      const tagCls = cf.dayun.tag==='好运'?'rt-great':cf.dayun.tag==='考验期'?'rt-warn':'rt-mid';
      h+=`<span class="fn-rating ${tagCls}">${cf.dayun.tag}</span>`;
      h+=`<div class="fn-text">${cf.dayun.evaluation}</div>`;
      h+=`<div class="dim" style="font-size:11px;margin-top:6px">距下一步大运还有 <span class="gold">${cf.dayun.remaining_years}</span> 年</div>`;
      h+=`<div class="fn-text mt8">${cf.stage_analysis}</div>`;
      h+=`<div class="fn-advice">${cf.overall_advice}</div>`;
      const el = document.getElementById('currentFortuneBox');
      if(el) el.innerHTML = h;
    });

  // 破解法
  fetch(API+'/remedy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(postData)})
    .then(r=>r.json()).then(j=>{
      if(!j.success) return;
      const rem = j.data;
      let h='';
      if(rem.missing_elements && rem.missing_elements.length){
        h+='<div class="dim" style="font-size:12px;margin-bottom:4px">命局偏弱五行</div>';
        h+='<div class="tags mb8">';
        rem.missing_elements.forEach(wx => h+=`<span class="tag tag-j">${wx}</span>`);
        h+='</div>';
      }
      (rem.remedies||[]).forEach(item => {
        h+=`<div class="rem-block"><div class="rem-title">${item.type}：${item.target}</div>`;
        h+=`<div class="dim" style="font-size:12px;margin-bottom:6px">${item.description||''}</div>`;
        (item.methods||[]).forEach(m => {
          h+=`<div class="rem-method"><span class="rem-badge">${m.level||''}</span><span class="rem-mname">${m.method||''}</span>${m.detail?'：'+m.detail:''}</div>`;
        });
        h+='</div>';
      });
      h+='<div class="mt12"><div class="dim" style="font-size:12px;margin-bottom:6px">通用化解法</div>';
      (rem.general_remedies||[]).forEach(g => {
        h+=`<div class="rem-method"><span class="rem-badge rem-badge-gen">${g.title}</span><span style="font-size:12px;color:#9a8e7e">${g.content}</span></div>`;
      });
      h+='</div>';
      if(rem.summary) h+=`<div class="tc mt12" style="font-size:12px;color:#9a8e7e">${rem.summary}</div>`;
      const el = document.getElementById('remedyBox');
      if(el) el.innerHTML = h || '<div class="dim tc">暂无</div>';
    });

  // 把控指南
  fetch(API+'/control-guide').then(r=>r.json()).then(j=>{
    if(!j.success) return;
    const cg = j.data;
    let h=`<div class="dim fn-text" style="margin-bottom:12px">${cg.overview}</div>`;
    (cg.sections||[]).forEach(sec => {
      h+=`<div class="ctrl-block"><div class="ctrl-title"><div class="ctrl-icon-wrap">${sec.icon}</div><span class="gold" style="font-size:16px;font-weight:700">${sec.title}</span></div>`;
      h+=`<div class="dim fn-text">${sec.content}</div>`;
      if(sec.tips && sec.tips.length){
        h+='<div class="ctrl-tips">';
        sec.tips.forEach(t => h+=`<div class="ctrl-tip">${t}</div>`);
        h+='</div>';
      }
      h+='</div>';
    });
    const el = document.getElementById('controlBox');
    if(el) el.innerHTML = h;
  });

  // 参考书籍（个性化生成）
  renderPersonalizedBooks(d);
}

function renderYearFortune(yf){
  if(!yf) return;
  let h='';
  h+=`<div class="year-nav">
    <div class="year-btn" onclick="changeYear(-1)">◀</div>
    <div class="year-num">${currentFortuneYear}</div>
    <div class="year-btn" onclick="changeYear(1)">▶</div>
  </div>`;
  h+=`<div class="fn-label">${yf.ganzhi}年 · ${yf.wuxing} · ${yf.shishen}</div>`;
  const rtCls = yf.rating==='大吉'?'rt-great':yf.rating==='小吉'?'rt-good':yf.rating==='欠佳'?'rt-warn':'rt-mid';
  h+=`<div class="tc"><span class="fn-rating ${rtCls}">${yf.rating}</span></div>`;
  h+=`<div class="fn-text">${yf.overall}</div>`;
  if(yf.dayun_background) h+=`<div class="fn-dy">${yf.dayun_background}</div>`;
  if(yf.relations && yf.relations.length){
    h+='<div class="mt8"><div class="dim" style="font-size:11px;margin-bottom:4px">流年关系</div>';
    yf.relations.forEach(r => h+=`<div class="fn-rel">${r}</div>`);
    h+='</div>';
  }
  if(yf.advice) h+=`<div class="fn-advice">${yf.advice}</div>`;
  const el = document.getElementById('yearFortuneBox');
  if(el) el.innerHTML = h;
}

function changeYear(delta){
  currentFortuneYear += delta;
  const el = document.getElementById('yearFortuneBox');
  if(el) el.innerHTML = '<div class="loading">加载中...</div>';
  fetch(API+'/year-fortune',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({paipan_result:paipanData,year:currentFortuneYear})
  }).then(r=>r.json()).then(j=>renderYearFortune(j.data));
}

function toggleCard(el){
  const card = el.parentElement;
  const body = card.querySelector('.card-body');
  const arrow = el.querySelector('.ct-arrow');
  if(body){
    body.classList.toggle('hide');
    if(arrow) arrow.textContent = body.classList.contains('hide') ? '▼' : '▲';
  }
}

function goBack(){
  document.getElementById('pageIndex').style.display = '';
  document.getElementById('pageResult').style.display = 'none';
  document.getElementById('pageResult').innerHTML = '';
  paipanData = null;
}
</script>
</body>
</html>
