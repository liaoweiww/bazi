# ============================================================
# 身份证签到系统 — 配置文件
# ============================================================

# ---- 地点标识 ----
# 用于区分不同签到点，签到记录中会标注此名称
# 每个地点请设置不同的名称，如 "北京办公室"、"上海办公室"
location: "1楼大厅"

# ---- Excel 签到记录保存路径 ----
# 建议设置为百度网盘同步目录，如:
#   macOS:   /Users/用户名/BaiduSyncDisk/签到记录
#   Windows: C:\Users\用户名\BaiduSyncDisk\签到记录
excel_dir: "./签到记录"

# ---- 读卡器设置 ----
# enabled: 这台电脑是否连接了身份证读卡器
#   true  → 刷卡主机（启动读卡器监听）
#   false → 同步终端（只做大屏显示/手动签到，不监听读卡器）
card_reader:
  enabled: false            # 有读卡器的电脑设为 true
  # reader_mode: "keyboard" 键盘模拟模式 / "com" 串口模式
  reader_mode: "keyboard"
  # 键盘模拟模式参数
  rapid_threshold: 0.1
  pause_threshold: 0.8
  # COM 口模式参数（reader_mode=com 时生效）
  com_port: ""              # 串口号，如 COM3，留空自动扫描
  com_baudrate: 115200      # 波特率，常用 115200/9600
  # 鱼住 YNR201 读卡器（WebSocket 服务模式，多客户端共享）
  # 需要 Windows 服务 yzwlReadCard 正在运行
  ws_url: "ws://127.0.0.1:30004/ws"   # yzwlReadCardServer WebSocket 地址
  # 调试模式
  debug: true

# ---- 语音播报设置 ----
# 注意：语音播报的欢迎语/提醒语模板也可在后台管理页面 /admin 中修改
voice:
  enabled: true
  welcome_template: "{name}，欢迎签到！"
  remind_template: "{name}，您的等待时间已到40分钟，请留意叫号。"
  macos_voice: "Eddy"
  windows_voice: ""

# ---- 计时提醒 ----
timer:
  remind_minutes: 40

# ---- 叫号大屏 Web 服务器 ----
web_server:
  host: "0.0.0.0"   # 0.0.0.0 = 允许局域网设备 + 本机访问
  port: 5002

# ---- ngrok 内网穿透（外网访问） ----
# 平板在外网（非同一 WiFi）也能访问叫号大屏
# 使用步骤：
#   1. 注册 ngrok 账号: https://ngrok.com
#   2. 获取 authtoken: https://dashboard.ngrok.com/get-started/your-authtoken
#   3. 安装 ngrok: brew install ngrok (Mac) 或下载 exe (Win)
#   4. 将 enabled 设为 true，填入 auth_token
ngrok:
  enabled: false   # 已通过 nohup 独立运行，无需 main.py 管理
  auth_token: ""

# ---- 自动备份 ----
backup:
  enabled: true
  interval_minutes: 15
  path: "./数据备份"
