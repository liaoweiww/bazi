<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软件激活 — 身份证签到系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(160deg,#070c14,#0d1525,#070c14);color:#e8edf2;
  min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:linear-gradient(160deg,rgba(20,30,48,0.95),rgba(14,20,32,0.95));
  border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:2.5rem 2rem;
  width:460px;max-width:92vw;box-shadow:0 25px 80px rgba(0,0,0,0.5);text-align:center;}
.icon{width:56px;height:56px;margin:0 auto 1.2rem;background:linear-gradient(135deg,#4f8fff,#6c5ce7);
  border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;
  box-shadow:0 10px 32px rgba(79,143,255,0.2);}
h2{font-size:1.2rem;font-weight:700;margin-bottom:0.3rem;
  background:linear-gradient(135deg,#e8edf2,#4f8fff);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-size:0.82rem;color:#8899aa;margin-bottom:1.8rem;}
.info{background:rgba(79,143,255,0.06);border:1px solid rgba(79,143,255,0.12);
  border-radius:12px;padding:1rem;margin-bottom:1.2rem;text-align:left;}
.info-label{font-size:0.72rem;color:#667788;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.3rem;}
.mcode{font-size:1.1rem;font-weight:700;color:#4f8fff;letter-spacing:0.04em;font-family:'SF Mono',Monaco,monospace;}
.mcode-hint{font-size:0.7rem;color:#667788;margin-top:0.3rem;}
input[type=text]{width:100%;padding:0.7rem 0.9rem;border:1.5px solid rgba(255,255,255,0.08);
  border-radius:10px;background:rgba(255,255,255,0.03);color:#e8edf2;font-size:0.9rem;
  outline:none;font-family:'SF Mono',Monaco,monospace;letter-spacing:0.03em;
  text-align:center;transition:border-color 0.2s;}
input:focus{border-color:#4f8fff;}
.btn{width:100%;padding:0.75rem;margin-top:1rem;border:none;border-radius:10px;
  background:linear-gradient(135deg,#4f8fff,#6c5ce7);color:#fff;font-size:1rem;
  font-weight:700;cursor:pointer;letter-spacing:0.04em;
  box-shadow:0 6px 20px rgba(79,143,255,0.25);transition:all 0.2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(79,143,255,0.35);}
.btn:disabled{opacity:0.5;pointer-events:none;}
.msg{margin-top:0.8rem;font-size:0.82rem;min-height:1.2em;}
.msg.ok{color:#22c55e;}.msg.err{color:#ef4444;}.msg.warn{color:#f59e0b;}
.lic-info{display:none;margin-top:1rem;padding:0.8rem;background:rgba(16,185,129,0.06);
  border:1px solid rgba(16,185,129,0.15);border-radius:10px;text-align:left;}
.lic-info .row{display:flex;justify-content:space-between;font-size:0.8rem;padding:0.2rem 0;}
.lic-info .lbl{color:#667788;}.lic-info .val{color:#e8edf2;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#128274;</div>
  <h2 id="title">软件激活</h2>
  <p class="sub" id="subtitle">请输入管理员提供的授权码</p>

  <div id="panel-activate">
    <div class="info">
      <div class="info-label">本机机器码</div>
      <div class="mcode" id="machine-code">加载中...</div>
      <div class="mcode-hint">将机器码发送给管理员，获取授权码</div>
    </div>
    <input type="text" id="lic-input" placeholder="授权码 (XXXX-XXXX-XXXX-XXXX-YYYYMMDD)" maxlength="30" autocomplete="off">
    <button class="btn" id="btn-activate" onclick="doActivate()">激 活</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="lic-info" id="lic-info">
    <div class="row"><span class="lbl">机器码</span><span class="val" id="li-mc">--</span></div>
    <div class="row"><span class="lbl">有效期至</span><span class="val" id="li-expiry">--</span></div>
    <div class="row"><span class="lbl">剩余天数</span><span class="val" id="li-days">--</span></div>
  </div>
</div>

<script>
(async function(){
  try{
    var r=await fetch('/api/license-status');
    var d=await r.json();
    document.getElementById('machine-code').textContent=d.machine_code||'未知';
    if(d.activated){
      document.getElementById('title').textContent='已激活';
      document.getElementById('subtitle').textContent='系统运行正常';
      document.getElementById('panel-activate').style.display='none';
      document.getElementById('lic-info').style.display='block';
      document.getElementById('li-mc').textContent=d.machine_code;
      document.getElementById('li-expiry').textContent=d.expiry||'--';
      document.getElementById('li-days').textContent=(d.days_left!=null?d.days_left+' 天':'--');
      if(d.days_left!=null&&d.days_left<=30) document.getElementById('li-days').style.color='#f59e0b';
      setTimeout(function(){window.location.href='/';},2000);
    }
  }catch(e){}
})();

async function doActivate(){
  var btn=document.getElementById('btn-activate');
  var msg=document.getElementById('msg');
  var code=document.getElementById('lic-input').value.trim();
  if(!code){msg.className='msg err';msg.textContent='请输入授权码';return;}
  btn.disabled=true;btn.textContent='验证中...';msg.className='msg';msg.textContent='';
  try{
    var r=await fetch('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})});
    var d=await r.json();
    if(d.ok){msg.className='msg ok';msg.textContent='激活成功！正在跳转...';setTimeout(function(){location.reload();},1500);}
    else{msg.className='msg err';msg.textContent=d.error||'激活失败';btn.disabled=false;btn.textContent='激 活';}
  }catch(e){msg.className='msg err';msg.textContent='网络错误';btn.disabled=false;btn.textContent='激 活';}
}
</script>
</body>
</html>
