<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据报表 - 签到统计</title>
<link rel="stylesheet" href="report.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="rp-wrap">
  <header class="rp-top">
    <div class="rp-top-l">
      <h1>签到数据报表</h1>
      <span class="rp-top-sub" id="rp-loc">--</span>
    </div>
    <div class="rp-top-r">
      <button class="rp-btn rp-btn-export" onclick="doExport()">📥 导出 Excel</button>
      <a href="/" class="rp-link">返回大屏</a>
      <a href="/admin" class="rp-link">后台管理</a>
    </div>
  </header>

  <!-- 概览卡片 -->
  <div class="rp-overview" id="rp-overview"></div>

  <!-- 图表第一行 -->
  <div class="rp-row">
    <div class="rp-panel rp-panel-8">
      <div class="rp-panel-head">
        <h3>签到趋势</h3>
        <div class="rp-tabs" id="period-tabs">
          <button class="rp-tab active" data-p="day">日</button>
          <button class="rp-tab" data-p="week">周</button>
          <button class="rp-tab" data-p="month">月</button>
        </div>
      </div>
      <div class="rp-chart-wrap"><canvas id="chart-trend"></canvas></div>
    </div>
    <div class="rp-panel rp-panel-4">
      <h3 class="rp-panel-title">状态分布</h3>
      <div class="rp-chart-wrap"><canvas id="chart-status"></canvas></div>
    </div>
  </div>

  <!-- 图表第二行 -->
  <div class="rp-row">
    <div class="rp-panel rp-panel-6">
      <h3 class="rp-panel-title">时段热力</h3>
      <div class="rp-chart-wrap"><canvas id="chart-hourly"></canvas></div>
    </div>
    <div class="rp-panel rp-panel-6">
      <h3 class="rp-panel-title">地点分布</h3>
      <div class="rp-chart-wrap"><canvas id="chart-location"></canvas></div>
    </div>
  </div>

  <!-- 数据筛选与导出 -->
  <div class="rp-panel rp-filter-panel">
    <div class="rp-panel-head">
      <h3>📋 数据筛选与导出</h3>
      <span class="rp-filter-hint">设置条件后自动筛选，点击导出下载 CSV</span>
    </div>
    <div class="rp-filter-row">
      <div class="rp-filter-item">
        <label>开始日期</label>
        <input type="date" id="rp-from" class="rp-filter-input" onchange="filterTable()">
      </div>
      <div class="rp-filter-item">
        <label>结束日期</label>
        <input type="date" id="rp-to" class="rp-filter-input" onchange="filterTable()">
      </div>
      <div class="rp-filter-item">
        <label>地点</label>
        <select id="rp-loc-filter" class="rp-filter-input" onchange="filterTable()">
          <option value="">全部地点</option>
        </select>
      </div>
      <div class="rp-filter-item">
        <label>状态</label>
        <select id="rp-status" class="rp-filter-input" onchange="filterTable()">
          <option value="">全部</option>
          <option value="等待中">等待中</option>
          <option value="已叫号">已叫号</option>
          <option value="已过号">已过号</option>
          <option value="已完成">已完成</option>
        </select>
      </div>
      <div class="rp-filter-item">
        <label>搜索姓名</label>
        <input type="text" id="rp-search" class="rp-filter-input" placeholder="输入姓名..." oninput="filterTable()">
      </div>
      <div class="rp-filter-item rp-filter-btns">
        <label>&nbsp;</label>
        <div class="rp-quick-row">
          <button class="rp-quick-btn" onclick="quickRange('today')">今天</button>
          <button class="rp-quick-btn" onclick="quickRange('week')">本周</button>
          <button class="rp-quick-btn" onclick="quickRange('month')">本月</button>
          <button class="rp-quick-btn" onclick="quickRange('all')">全部</button>
        </div>
      </div>
    </div>

    <!-- 筛选统计 -->
    <div class="rp-filter-stats" id="rp-filter-stats" style="display:none">
      <span><strong id="rp-fs-total">0</strong> 条匹配</span>
      <span style="color:var(--green)"><strong id="rp-fs-done">0</strong> 已完成</span>
      <span style="color:var(--yellow)"><strong id="rp-fs-wait">0</strong> 等待中</span>
    </div>
  </div>

  <!-- 人员名单 -->
  <div class="rp-panel rp-table-panel">
    <div class="rp-tbl-wrap">
      <table class="rp-tbl">
        <thead>
          <tr>
            <th>#</th><th>姓名</th><th>身份证号</th><th>签到时间</th>
            <th>已等待</th><th>倒计时</th><th>地点</th><th>状态</th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
    <div class="rp-tbl-foot">
      <span id="tbl-count">共 0 人</span>
      <button class="rp-btn rp-btn-export rp-btn-sm" onclick="doExport()">📥 导出当前数据</button>
    </div>
  </div>
</div>

<script src="report.js?v=2"></script>
</body>
</html>
