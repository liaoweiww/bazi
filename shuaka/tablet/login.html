<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 签到系统管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0f1923;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; color: #e8edf2;
}
.login-box {
  background: #1a2736; border: 1px solid #1e3044; border-radius: 16px;
  padding: 2.5rem 2rem; width: 360px; max-width: 90vw;
}
.login-box h1 { text-align: center; font-size: 1.3rem; margin-bottom: 0.3rem; }
.login-box .sub { text-align: center; font-size: 0.85rem; color: #8899aa; margin-bottom: 1.8rem; }
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: #8899aa; }
.form-group input {
  width: 100%; padding: 0.6rem 0.75rem;
  border: 1px solid #1e3044; border-radius: 8px;
  background: #0d1520; color: #e8edf2; font-size: 0.95rem;
  font-family: inherit; outline: none;
}
.form-group input:focus { border-color: #3b82f6; }
.btn {
  width: 100%; padding: 0.65rem; border: none; border-radius: 8px;
  font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit;
  background: #3b82f6; color: #fff; margin-top: 0.5rem;
}
.btn:hover { background: #2563eb; }
.error { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 0.8rem; display: none; }
.error.show { display: block; }
</style>
</head>
<body>
<div class="login-box">
  <h1>签到叫号系统</h1>
  <div class="sub">后台管理登录 · 默认账号 admin / admin123</div>
  <form id="login-form">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" required autofocus>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn">登 录</button>
  </form>
  <div class="error" id="error-msg">用户名或密码错误</div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (data.ok) {
      localStorage.setItem('signin_token', data.token);
      localStorage.setItem('signin_user', JSON.stringify(data.user));
      window.location.href = '/admin';
    } else {
      document.getElementById('error-msg').classList.add('show');
    }
  } catch (err) {
    document.getElementById('error-msg').textContent = '连接失败，请检查服务器';
    document.getElementById('error-msg').classList.add('show');
  }
});
</script>
</body>
</html>
